protocol_name = "DNS"
protocol_version = "4034-6840"
rule_path = "../output/rules_unbound_dnssec_run.json"
original_llvm_ir_path = "../output/bind9-ir/bind9.bc"
[wpa]
path = "../output/bind9-ir/ffp.txt"
[debug]
code_slice_replace_mode = 1
