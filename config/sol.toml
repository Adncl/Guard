[database]
path = "../output/sol-analysis"
[llm]
llm_api_platform = "https://api.deepseek.com/v1"
llm_model_deepseek_v3 = "deepseek-chat"
llm_model_deepseek_r1 = "deepseek-reasoner"
llm_query_max_attempts = 3
llm_violation_repeat_times = 3
[project]
project_path = "../output/sol-source"
