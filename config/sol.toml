protocol_name = "MQTT"
protocol_version = "3.1.1"
rule_path = "../output/rules.json"
original_llvm_ir_path = "../output/sol-ir/sol.bc"
[wpa]
path = "../output/sol-ir/ffp.txt"
[debug]
code_slice_replace_mode = 0
